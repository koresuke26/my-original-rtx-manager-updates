name: RTX Manager Health Monitor

on:
  push:
    branches: [main]
    paths:
      - "My Original RTX Manager.pyw"
      - "latest.json"
      - "*.mcpack"
      - "scripts/health_check.py"
      - ".github/workflows/rtx-manager-health.yml"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run health check
        id: health
        continue-on-error: true
        run: |
          python scripts/health_check.py 2>&1 | tee health-check.log

      - name: Create or update failure issue
        if: steps.health.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[自動監視] My Original RTX Manager に異常を検出';
            const log = fs.readFileSync('health-check.log', 'utf8').slice(-12000);
            const body = [
              'GitHub Actions の自動監視で異常を検出しました。',
              '',
              `- 実行: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              '',
              '```text',
              log,
              '```'
            ].join('\n');

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close resolved failure issue
        if: steps.health.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '[自動監視] My Original RTX Manager に異常を検出';
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            const existing = issues.find(issue => !issue.pull_request && issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: '✅ 自動監視で正常状態への復旧を確認しました。このIssueを自動で閉じます。'
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: 'closed'
              });
            }

      - name: Fail workflow when health check failed
        if: steps.health.outcome == 'failure'
        run: exit 1
